server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:StudentHubSecureJWTSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm2026!}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

spring:
  application:
    name: studenthub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

---
# Default Postgres Profile (Supabase PostgreSQL)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.tctecdannkhtjgxuwyol.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:StudentHub2026Secure!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
# H2 Profile
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:studenthubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
