services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (Spring Boot + Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: studenthub-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: DB_URL
        value: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: postgres.tctecdannkhtjgxuwyol
      - key: DB_PASSWORD
        value: StudentHub2026Secure!
      - key: JWT_SECRET
        value: StudentHubSecureJWTSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm2026!
      - key: JWT_EXPIRATION
        value: "86400000"

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: studenthub-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://studenthub-backend.onrender.com/api
